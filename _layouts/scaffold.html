layout: default

{% include sidebar/sidebar.html %}

<div class="mobileProfile">
    {% include widgets/about.html %}
    {% include widgets/contacts.html %}
    {% include widgets/theme.html %}
</div>

{{ content }}

<div id="rightCont" class="fixedCont">
    {% include bottomNav.html %}
</div>

<script>
    (() => {
        const root = document.documentElement;
        const buttons = document.querySelectorAll('[data-theme-choice]');

        const updateButtons = () => {
            const currentTheme = localStorage.getItem('theme') || 'system';
            buttons.forEach((button) => {
                button.setAttribute('aria-pressed', button.dataset.themeChoice === currentTheme);
            });
        };

        buttons.forEach((button) => {
            button.addEventListener('click', () => {
                const theme = button.dataset.themeChoice;
                if (theme === 'system') {
                    localStorage.removeItem('theme');
                    delete root.dataset.theme;
                } else {
                    localStorage.setItem('theme', theme);
                    root.dataset.theme = theme;
                }
                updateButtons();
            });
        });

        updateButtons();
    })();
</script>
